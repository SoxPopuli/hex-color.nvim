[package]
name = "hex-color-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true

[dependencies]
mlua = { version = "0.12.0", features = ["luajit", "module"] }
regex-automata = "0.4.17"
strum = { version = "0.28.0", features = ["derive"] }
const_format = {version = "0.2.36", features = ["fmt"]}
thiserror = "2.0.19"

[dev-dependencies]
test-case = "3.3.1"
