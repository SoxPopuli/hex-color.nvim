[package]
name = "hex-color-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true

[dependencies]
regex-automata = "0.4.17"
strum = { version = "0.28.0", features = ["derive"] }
const_format = { version = "0.2.36", features = ["fmt"] }
thiserror = "2.0.19"

[dev-dependencies]
pretty_assertions = "1.4.1"
test-case = "3.3.1"

[build-dependencies]
cbindgen = "0.29.4"
